[build-system]
requires = ["setuptools>=68", "wheel", "numpy>=1.25"]
build-backend = "setuptools.build_meta"

[project]
name = "stitchv2"
version = "0.1.0"
description = "Streaming STITCH-style low-coverage imputation in Python/JAX."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.25",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "pysam>=0.22",
  "jax>=0.4.28",
  "jaxlib>=0.4.28",
  "scipy>=1.11",
  "xarray>=2024.3.0",
  "dask[array]>=2024.3.0",
  "distributed>=2024.3.0",
]

[project.optional-dependencies]
plink = ["npplink>=0.3"]
ml = ["lightgbm>=4.0", "optuna>=3.6"]
dev = ["pytest>=8.0"]

[project.scripts]
stitchv2 = "stitchv2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
