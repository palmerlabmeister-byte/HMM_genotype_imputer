name: stitchv2-tutorial
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Python runtime. STITCHV2 declares python >=3.10; the tutorial env uses
  # Python 3.13 to match the current benchmark/tutorial direction.
  - python=3.13
  - pip

  # Core STITCHV2 runtime dependencies from pyproject.toml.
  - numpy>=2.1
  - scipy>=1.14
  - pandas>=2.2
  - pyarrow>=18
  - pysam>=0.22
  - jax>=0.7
  - jaxlib
  - xarray>=2024.3
  - dask>=2024.3
  - distributed>=2024.3

  # Calibration, metrics, reports, plots, and notebooks used by the tutorial
  # and benchmark scripts.
  - scikit-learn>=1.5
  - lightgbm>=4.0
  - optuna>=3.6
  - matplotlib>=3.9
  - seaborn>=0.13
  - ipython
  - jupyterlab
  - tqdm
  - rich

  # Genomics I/O and benchmark utilities.
  - cyvcf2>=0.31
  - htslib
  - samtools
  - bcftools
  - gatk4
  - zarr
  - zstandard

  # Original STITCH baseline used by benchmark scripts.
  - r-base>=4.3
  - r-stitch
  - r-data.table

  # Development and validation.
  - pytest>=8.3
  - pytest-cov

  # Install the local package and optional Python extras from the repo root:
  # conda env create -f environment.tutorial.yml
  - pip:
      - -e .[ml,dev]
